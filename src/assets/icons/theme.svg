<svg
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    /* root class: .sun (default) or .moon */
    svg .sun-group,
    svg .moon-group,
    svg .rays {
      transform-origin: 12px 12px;
      transform-box: fill-box;
    }

    /* transitions */
    svg .sun-group {
      transition: opacity 240ms ease, transform 360ms ease;
      opacity: 1;
      transform: scale(1);
    }

    svg .rays {
      transition: opacity 240ms ease, transform 360ms ease;
      opacity: 1;
      transform: scale(1);
    }

    svg .moon-group {
      transition: opacity 240ms ease, transform 360ms ease;
      opacity: 0;
      transform: scale(0.92);
    }

    /* ---- state: moon ---- */
    svg.moon .sun-group {
      opacity: 0;
      transform: scale(0.98);
    }
    svg.moon .rays {
      opacity: 0;
      transform: scale(0);
    }
    svg.moon .moon-group {
      opacity: 1;
      transform: scale(1);
    }

    /* ---- reduced motion ---- */
    @media (prefers-reduced-motion: reduce) {
      svg .sun-group,
      svg .moon-group,
      svg .rays {
        transition: none !important;
      }
    }
  </style>

  <!-- SUN -->
  <g class="sun-group">
    <circle cx="12" cy="12" r="4" fill="#222222" />

    <g class="rays" stroke="#222222" stroke-width="2" stroke-linecap="round">
      <path d="M12 5V3" />
      <path d="M12 21V19" />
      <path d="M16.9498 7.04996L18.364 5.63574" />
      <path d="M5.63608 18.3644L7.05029 16.9502" />
      <path d="M19 12L21 12" />
      <path d="M3 12L5 12" />
      <path d="M16.9498 16.95L18.364 18.3643" />
      <path d="M5.63608 5.63559L7.05029 7.0498" />
    </g>
  </g>

  <!-- MOON -->
  <g class="moon-group">
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M15 4C15.292 4 15.438 4 15.5781 4.04183C16.192 4.22522 16.4775 4.93111 16.1637 5.48976C16.0921 5.61719 15.8744 5.82779 15.4389 6.249C13.935 7.70352 13 9.74257 13 12C13 14.2574 13.935 16.2965 15.4389 17.751C15.8744 18.1722 16.0921 18.3828 16.1637 18.5102C16.4775 19.0689 16.192 19.7748 15.5781 19.9582C15.438 20 15.292 20 15 20C10.5817 20 7 16.4183 7 12C7 7.58172 10.5817 4 15 4Z"
      fill="#222222"
    />
  </g>
</svg>
